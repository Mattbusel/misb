name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features
      - run: cargo test --no-default-features --lib
  action:
    # The Action from this checkout: must fail on the ffmpeg samples and pass
    # on a clean stream.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install --path . --bin misb-check --root "$RUNNER_TEMP/misb"
      - name: Fails on the public samples
        run: |
          if "$RUNNER_TEMP/misb/bin/misb-check" --format github tests/data/day_flight.klv; then
            echo "expected a failure"; exit 1
          fi
      - name: JSON output parses
        run: |
          set +e
          "$RUNNER_TEMP/misb/bin/misb-check" --format json tests/data/ > report.json
          test $? -eq 1
          python3 -c "import json; r = json.load(open('report.json')); assert len(r) == 6 and not any(f['passed'] for f in r)"
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.70
      - run: cargo build --no-default-features
      - run: cargo build
  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, wasm32-unknown-unknown
      - run: cargo build --no-default-features --target thumbv7em-none-eabihf
      - run: cargo build --no-default-features --features alloc --target wasm32-unknown-unknown
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path python/Cargo.toml
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo clippy --manifest-path python/Cargo.toml -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
  cpp:
    # The single header, against the same reference data, under ASan/UBSan.
    strategy:
      matrix:
        cxx: [g++, clang++]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ${{ matrix.cxx }} -std=c++17 -O1 -g -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-sanitize-recover=undefined -I cpp cpp/tests/test_misb.cpp -o test_misb
      - run: ./test_misb
  cpp-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cl /std:c++17 /EHsc /W4 /WX /I cpp cpp\tests\test_misb.cpp /Fe:test_misb.exe
      - run: .\test_misb.exe
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - run: mkdir -p fuzz/corpus/parse && cp tests/data/*.klv tests/data/*.bin fuzz/corpus/parse/
      - run: cargo fuzz run parse -- -max_total_time=120
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          args: --release --out dist
      - name: Install the wheel and run the tests
        shell: bash
        run: |
          python -m pip install -q pytest
          python -m pip install -q python/dist/*.whl
          cd python/tests && python -m pytest -q .
      - name: Check the type stubs against the built module
        shell: bash
        run: |
          python -m pip install -q mypy
          cd python/tests && python -m mypy.stubtest misb
